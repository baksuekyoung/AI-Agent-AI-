<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서관 AI 비서 & 데이터 관리</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background: #f4f6f9; display: flex; gap: 20px; }
        .pane { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        h2 { color: #333; font-size: 1.2rem; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .chat-box { height: 300px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; font-size: 0.9rem; }
        .user { background: #e3f2fd; text-align: right; }
        .ai { background: #e8f5e9; }
        .summary-card { background: #e2e8f0; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background: #f1f5f9; }
    </style>
</head>
<body>

    <!-- 왼쪽: AI 채팅 & 데이터 요약 -->
    <div class="pane">
        <h2>🤖 도서관 AI 비서</h2>
        <div id="summaryCard" class="summary-card">데이터 요약 로딩 중...</div>
        
        <div id="chatBox" class="chat-box"></div>
        <input type="text" id="userInput" placeholder="질문을 입력하세요 (예: 이번 달 방문객 어때?)">
        <button onclick="sendMessage()">전송</button>
    </div>

    <!-- 오른쪽: 데이터 관리 (CRUD) -->
    <div class="pane">
        <h2>📊 데이터 관리 (CRUD)</h2>
        <div>
            <input type="date" id="inputDate">
            <input type="number" id="inputVisitors" placeholder="방문객 수">
            <input type="number" id="inputCheckouts" placeholder="대출 건수">
            <input type="text" id="inputMemo" placeholder="메모">
            <button onclick="addData()">데이터 추가</button>
        </div>
        <div style="max-height: 250px; overflow-y: auto;">
            <table id="dataTable">
                <thead>
                    <tr><th>날짜</th><th>방문객</th><th>대출</th><th>관리</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
